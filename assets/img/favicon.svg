<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #111111; }
    .fg { fill: none; stroke: #ffffff; stroke-width: 5; }
    .dot { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f1f1ef; }
      .fg { stroke: #111111; }
      .dot { fill: #111111; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="14"/>
  <circle class="fg" cx="32" cy="32" r="14"/>
  <circle class="dot" cx="32" cy="32" r="5"/>
</svg>
